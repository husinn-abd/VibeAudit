services:
  api:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @vibeaudit/api dev"
    ports:
      - "${VIBEAUDIT_API_PORT:-4317}:${VIBEAUDIT_API_PORT:-4317}"
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:./dev.db}
      VIBEAUDIT_API_HOST: ${VIBEAUDIT_API_HOST:-0.0.0.0}
      VIBEAUDIT_API_PORT: ${VIBEAUDIT_API_PORT:-4317}
      VIBEAUDIT_API_LOGGER: ${VIBEAUDIT_API_LOGGER:-true}
      VIBEAUDIT_API_MAX_IMPORT_BYTES: ${VIBEAUDIT_API_MAX_IMPORT_BYTES:-10485760}
      VIBEAUDIT_DEFAULT_ORGANIZATION_ID: ${VIBEAUDIT_DEFAULT_ORGANIZATION_ID:-org_default}
      VIBEAUDIT_DEFAULT_ORGANIZATION_NAME: ${VIBEAUDIT_DEFAULT_ORGANIZATION_NAME:-Default Organization}
      VIBEAUDIT_DEFAULT_PROJECT_ID: ${VIBEAUDIT_DEFAULT_PROJECT_ID:-proj_vibeaudit_demo}
      VIBEAUDIT_DEFAULT_PROJECT_NAME: ${VIBEAUDIT_DEFAULT_PROJECT_NAME:-VibeAudit Demo}
      VIBEAUDIT_DEFAULT_REPOSITORY_URL: ${VIBEAUDIT_DEFAULT_REPOSITORY_URL:-https://github.com/husinn-abd/VibeAudit}

  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @vibeaudit/web dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4317}
      VITE_ORGANIZATION_ID: ${VITE_ORGANIZATION_ID:-org_default}
      VITE_PROJECT_ID: ${VITE_PROJECT_ID:-proj_vibeaudit_demo}
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
